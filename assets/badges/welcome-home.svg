<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<defs>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE0EE"/><stop offset="0.45" stop-color="#FF8FC1"/><stop offset="1" stop-color="#D9488B"/></linearGradient>
  <radialGradient id="disc" cx="0.4" cy="0.32" r="0.8"><stop offset="0" stop-color="#FFE0EE"/><stop offset="0.75" stop-color="#FF8FC1"/><stop offset="1" stop-color="#D9488B"/></radialGradient>
  <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8FC1"/><stop offset="1" stop-color="#D9488B"/></linearGradient>
  <clipPath id="discClip"><circle cx="128" cy="110" r="76"/></clipPath>
</defs>
<!-- ribbon tails -->
<path d="M100 170 L78 240 L94 230 L104 246 L126 178 Z" fill="url(#tail)" stroke="#D9488B" stroke-width="4" stroke-linejoin="round"/>
<path d="M156 170 L178 240 L162 230 L152 246 L130 178 Z" fill="url(#tail)" stroke="#D9488B" stroke-width="4" stroke-linejoin="round"/>
<!-- soft shadow + puffy rim -->
<circle cx="128" cy="116" r="96" fill="#D9488B" opacity="0.35"/>
<circle cx="128" cy="110" r="96" fill="url(#rim)"/>
<ellipse cx="128" cy="40" rx="58" ry="14" fill="#fff" opacity="0.45"/>
<!-- inner disc -->
<circle cx="128" cy="110" r="78" fill="#D9488B" opacity="0.5"/>
<circle cx="128" cy="110" r="76" fill="url(#disc)"/>
<!-- icon: outline layer then white fill layer -->
<g fill="#D9488B" stroke="#D9488B" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"><path d="M128 62 L182 106 L168 106 L168 152 L88 152 L88 106 L74 106 Z"/></g>
<g fill="#ffffff"><path d="M128 62 L182 106 L168 106 L168 152 L88 152 L88 106 L74 106 Z"/></g>
<path d="M128 140 C108 126 110 108 121 109 C125 110 128 114 128 114 C128 114 131 110 135 109 C146 108 148 126 128 140 Z" fill="#FF8FC1"/>
<!-- gloss -->
<g clip-path="url(#discClip)"><ellipse cx="118" cy="62" rx="62" ry="30" fill="#fff" opacity="0.32"/></g>

</svg>