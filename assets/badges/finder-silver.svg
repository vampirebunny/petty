<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<defs>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFCFE"/><stop offset="0.45" stop-color="#BAC2CE"/><stop offset="1" stop-color="#76808F"/></linearGradient>
  <radialGradient id="disc" cx="0.4" cy="0.32" r="0.8"><stop offset="0" stop-color="#D9F9EC"/><stop offset="0.75" stop-color="#5FD6A8"/><stop offset="1" stop-color="#2A9C72"/></radialGradient>
  <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BAC2CE"/><stop offset="1" stop-color="#76808F"/></linearGradient>
