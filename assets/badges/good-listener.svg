<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<defs>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ECE3FF"/><stop offset="0.45" stop-color="#A98BFF"/><stop offset="1" stop-color="#6F4FD8"/></linearGradient>
  <radialGradient id="disc" cx="0.4" cy="0.32" r="0.8"><stop offset="0" stop-color="#ECE3FF"/><stop offset="0.75" stop-color="#A98BFF"/><stop offset="1" stop-color="#6F4FD8"/></radialGradient>
  <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A98BFF"/><stop offset="1" stop-color="#6F4FD8"/></linearGradient>
  <clipPath id="discClip"><circle cx="128" cy="110" r="76"/></clipPath>
</defs>
<!-- ribbon tails -->
<path d="M100 170 L78 240 L94 230 L104 246 L126 178 Z" fill="url(#tail)" stroke="#6F4FD8" stroke-width="4" stroke-linejoin="round"/>
<path d="M156 170 L178 240 L162 230 L152 246 L130 178 Z" fill="url(#tail)" stroke="#6F4FD8" stroke-width="4" stroke-linejoin="round"/>
<!-- soft shadow + puffy rim -->
<circle cx="128" cy="116" r="96" fill="#6F4FD8" opacity="0.35"/>
<circle cx="128" cy="110" r="96" fill="url(#rim)"/>
<ellipse cx="128" cy="40" rx="58" ry="14" fill="#fff" opacity="0.45"/>
<!-- inner disc -->
<circle cx="128" cy="110" r="78" fill="#6F4FD8" opacity="0.5"/>
<circle cx="128" cy="110" r="76" fill="url(#disc)"/>
<!-- icon: outline layer then white fill layer -->
<g fill="#6F4FD8" stroke="#6F4FD8" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"><path d="M102 100 L102 126 Q128 142 154 126 L154 100 Z"/><polygon points="128,70 182,92 128,114 74,92"/></g>
<g fill="#ffffff"><path d="M102 100 L102 126 Q128 142 154 126 L154 100 Z"/><polygon points="128,70 182,92 128,114 74,92"/></g>
<path d="M128 92 L170 100 L170 128" fill="none" stroke="#6F4FD8" stroke-width="5" stroke-linecap="round"/><circle cx="170" cy="132" r="7" fill="#A98BFF" stroke="#6F4FD8" stroke-width="4"/><circle cx="128" cy="92" r="6" fill="#A98BFF"/>
<!-- gloss -->
<g clip-path="url(#discClip)"><ellipse cx="118" cy="62" rx="62" ry="30" fill="#fff" opacity="0.32"/></g>

</svg>