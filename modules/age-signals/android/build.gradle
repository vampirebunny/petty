plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.agesignals'
version = '0.1.0'

android {
  namespace "expo.modules.agesignals"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  // Play Age Signals 0.0.4: requestAgeSignalsAccess, then checkAgeSignals when SHARED.
  implementation "com.google.android.play:age-signals:0.0.4"
}
