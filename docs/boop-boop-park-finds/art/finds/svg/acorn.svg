<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 150" width="120" height="150"><defs><radialGradient xmlns="http://www.w3.org/2000/svg" id="acBody" cx="0.36" cy="0.3" r="0.8"><stop offset="0" stop-color="#F8D29A" /><stop offset="0.45" stop-color="#DB9C57" /><stop offset="0.85" stop-color="#A9672E" /><stop offset="1" stop-color="#7E4A1F" /></radialGradient>
