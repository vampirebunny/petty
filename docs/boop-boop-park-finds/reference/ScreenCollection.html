<!doctype html>

<x-dc>

<style>

a{color:#F7B8D2}a:hover{color:#FFD6E6}
.fd-float{transform-box:fill-box;transform-origin:50% 50%;animation:fdFloat 3.2s ease-in-out infinite}
.fd-pool{transform-box:fill-box;transform-origin:50% 50%;animation:fdPool 3.2s ease-in-out infinite}
