      <g transform="translate(190 420)"><use href="#ciDog"></use></g>
    </svg>
    <div style="position: absolute; inset: 0; background: rgba(40,20,50,0.45)"></div>
    <div style="position: absolute; left: 24px; right: 24px; top: 200px; background: #FFF4F8; border-radius: 32px; box-shadow: 0 8px 0 #F2C6D8, 0 20px 40px rgba(40,20,50,0.35); padding: 28px 22px 24px 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">

      <div style="font-size: 24px; font-weight: 700; line-height: 1.2">Your collection is stored in your Treasure Chest</div>

    <svg style="position: absolute; left: 266px; top: 286px" width="40" height="34" viewBox="0 0 40 34" aria-hidden="true"><path d="M2 0 L30 0 Q34 14 26 30 Q18 14 2 0 Z" fill="#FFFFFF"></path></svg>

    <div style="position: absolute; left: 16px; right: 16px; top: 672px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">

      <button style="height: 62px; border: none; border-radius: 20px; background: linear-gradient(180deg, #CFF3E4 0%, #95DFC1 100%); box-shadow: inset 0 3px 0 rgba(255,255,255,0.6), 0 4px 0 #5FBF98; font-family: inherit; font-size: 12px; font-weight: 600; color: #1F5A45">Play</button>
